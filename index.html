<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>다중 분할 웹 뷰어 (프록시 우회 지원)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background-color: #1e1e1e;
      color: #fff;
    }

    /* 상단 통합 컨트롤 바 */
    #top-bar {
      padding: 8px 16px;
      background: #2d2d2d;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #444;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #top-bar select, #top-bar input[type="text"] {
      padding: 4px 8px;
      border-radius: 4px;
      background: #3e3e3e;
      color: #fff;
      border: 1px solid #555;
      font-size: 13px;
    }
    #proxy-base-url {
      width: 260px;
    }

    /* 패널 컨테이너 */
    #container {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 49px);
      overflow: hidden;
      position: relative;
    }

    /* 개별 분할 패널 */
    .panel {
      display: flex;
      flex-direction: column;
      min-width: 150px;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }

    /* 패널 상단 URL 컨트롤 바 */
    .url-bar {
      display: flex;
      align-items: center;
      background: #f1f3f4;
      padding: 6px;
      border-bottom: 1px solid #ccc;
      gap: 6px;
      color: #333;
    }
    .url-bar input[type="text"] {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    .url-bar label {
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      white-space: nowrap;
      color: #555;
    }
    .url-bar button {
      padding: 6px 10px;
      font-size: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .url-bar button:hover {
      background: #0056b3;
    }

    /* iframe 래퍼 영역 */
    .iframe-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      overflow-y: auto;
    }

    /* 칸막이 드래그 중 iframe 마우스 간섭 방지 오버레이 */
    .drag-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: none;
      z-index: 10;
    }

    /* 칸막이 (Resizer) */
    .resizer {
      width: 6px;
      background: #444;
      cursor: col-resize;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .resizer:hover, .resizer.dragging {
      background: #007bff;
    }
  </style>
</head>
<body>

  <!-- 상단 컨트롤 바 -->
  <div id="top-bar">
    <div class="control-group">
      <label for="split-select">화면 분할:</label>
      <select id="split-select">
        <option value="3" selected>3분할</option>
        <option value="4">4분할</option>
        <option value="5">5분할</option>
        <option value="6">6분할</option>
        <option value="7">7분할</option>
        <option value="8">8분할</option>
        <option value="9">9분할</option>
        <option value="10">10분할</option>
      </select>
    </div>

    <div class="control-group">
      <label for="proxy-base-url">프록시 서버 주소:</label>
      <input type="text" id="proxy-base-url" value="http://localhost:3000/proxy?url=" title="구축한 프록시 엔드포인트 URL을 입력하세요" />
    </div>
  </div>

  <!-- 분할 뷰어 메인 컨테이너 -->
  <div id="container"></div>

  <script>
    const container = document.getElementById('container');
    const select = document.getElementById('split-select');
    const proxyBaseInput = document.getElementById('proxy-base-url');

    // 패널 렌더링 함수
    function setupPanels(count) {
      container.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.style.flex = "1";

        // 패널 HTML 구조 (기본값으로 프록시 우회 체크박스 활성화)
        panel.innerHTML = `
          <div class="url-bar">
            <input type="text" placeholder="https://band.us 입력" />
            <label>
              <input type="checkbox" class="chk-proxy" checked /> 우회 프록시
            </label>
            <button>이동</button>
          </div>
          <div class="iframe-wrapper">
            <div class="drag-overlay"></div>
            <iframe sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
          </div>
        `;

        const input = panel.querySelector('input[type="text"]');
        const chkProxy = panel.querySelector('.chk-proxy');
        const btn = panel.querySelector('button');
        const iframe = panel.querySelector('iframe');

        // URL 로드 함수
        const loadUrl = () => {
          let rawUrl = input.value.trim();
          if (!rawUrl) return;

          // 프로토콜 자동 보정
          if (!/^https?:\/\//i.test(rawUrl)) {
            rawUrl = 'https://' + rawUrl;
            input.value = rawUrl;
          }

          // 프록시 사용 여부에 따른 최종 URL 결정
          if (chkProxy.checked) {
            const proxyBase = proxyBaseInput.value.trim();
            iframe.src = proxyBase + encodeURIComponent(rawUrl);
          } else {
            iframe.src = rawUrl;
          }
        };

        btn.addEventListener('click', loadUrl);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') loadUrl();
        });

        container.appendChild(panel);

        // 마지막 패널이 아니면 칸막이(Resizer) 추가
        if (i < count - 1) {
          const resizer = document.createElement('div');
          resizer.className = 'resizer';
          container.appendChild(resizer);
          attachResizerEvent(resizer, panel);
        }
      }
    }

    // 마우스 드래그 칸막이 크기 조절
    function attachResizerEvent(resizer, prevPanel) {
      let isDragging = false;
      let startX = 0;
      let startPrevWidth = 0;
      let startNextWidth = 0;
      let nextPanel = null;

      resizer.addEventListener('mousedown', (e) => {
        isDragging = true;
        resizer.classList.add('dragging');
        nextPanel = resizer.nextElementSibling;

        startX = e.clientX;
        startPrevWidth = prevPanel.getBoundingClientRect().width;
        startNextWidth = nextPanel.getBoundingClientRect().width;

        // 드래그 중 iframe이 마우스 포인터를 가로채지 못하도록 오버레이 표시
        document.querySelectorAll('.drag-overlay').forEach(el => el.style.display = 'block');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const deltaX = e.clientX - startX;
        const newPrevWidth = startPrevWidth + deltaX;
        const newNextWidth = startNextWidth - deltaX;

        // 최소 너비(120px) 유지
        if (newPrevWidth > 120 && newNextWidth > 120) {
          prevPanel.style.flex = "none";
          nextPanel.style.flex = "none";
          prevPanel.style.width = `${newPrevWidth}px`;
          nextPanel.style.width = `${newNextWidth}px`;
        }
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          resizer.classList.remove('dragging');
          document.querySelectorAll('.drag-overlay').forEach(el => el.style.display = 'none');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });
    }

    // 분할 개수 변경 시 재배치
    select.addEventListener('change', (e) => {
      setupPanels(parseInt(e.target.value));
    });

    // 기본 3분할 실행
    setupPanels(3);
  </script>
</body>
</html>
